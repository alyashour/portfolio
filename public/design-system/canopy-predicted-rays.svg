<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<title>Two artistic rock-surface patches with supporting feature points</title>
<style>path,polygon{vector-effect:non-scaling-stroke}</style>
<!-- The central bare facet: irregular support boundary follows the rock fractures. -->
<polygon points="974,370 1089,330 1140,408 1060,452 991,475 967,426" fill="#9da781" fill-opacity="0.055" stroke="#e8e9d8" stroke-width="1.15" opacity="0.85"/>
<!-- A second, smaller facet on the overhanging right-hand rock. -->
<polygon points="1138,193 1210,224 1209,300 1187,332 1150,314 1129,236" fill="#9da781" fill-opacity="0.055" stroke="#e8e9d8" stroke-width="1.15" opacity="0.85"/>
<!-- Sparse, irregular support samples: illustrative, not detector outputs. -->
<g fill="#e8e9d8" opacity="0.8">
<circle cx="991" cy="391" r="2"/><circle cx="1032" cy="373" r="2"/><circle cx="1077" cy="358" r="2"/><circle cx="1106" cy="403" r="2"/><circle cx="1051" cy="416" r="2"/><circle cx="1004" cy="445" r="2"/>
<circle cx="1155" cy="221" r="2"/><circle cx="1188" cy="239" r="2"/><circle cx="1155" cy="275" r="2"/><circle cx="1186" cy="302" r="2"/>
</g>
<!-- Illustrative projected illumination rays; source occluded by the left overhang. -->
<g fill="none" stroke="#e8e9d8" stroke-width="1.15" opacity="0.72" stroke-linecap="round">
  <path d="M786 326L1070 438"/>
  <path d="M791 342L1243 636"/>
  <path d="M787 356L1089 740"/>
</g>
<!-- Short occluded continuations locate the shared origin behind the rock. -->
<g fill="none" stroke="#e8e9d8" stroke-width="0.75" opacity="0.3" stroke-dasharray="3 5">
  <path d="M752 312L786 326 M752 312L791 342 M752 312L787 356"/>
</g>
<g fill="none" stroke="#e8e9d8" stroke-width="0.9" opacity="0.75">
  <circle cx="1070" cy="438" r="3"/><circle cx="1243" cy="636" r="3"/><circle cx="1089" cy="740" r="3"/>
</g>
</svg>
